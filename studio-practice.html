<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yoshi.Lab | AI教材プラス</title>
<style>:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#f3f8ff;background:#0b1c35}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#05142cbb,#07152aee),url('./yoshilab-unified-mountain.png') center/cover fixed}main{max-width:860px;margin:auto;padding:24px 16px 90px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}a{color:#a1d4ff}.panel{background:#172b4ceb;border:1px solid #456995;border-radius:18px;padding:19px;margin:18px 0;box-shadow:0 10px 25px #0004}h1{font-size:clamp(24px,5vw,34px)}h2{font-size:21px}label{display:grid;gap:7px;color:#cbdcf3;font-size:14px}select,button{font:inherit;border-radius:10px;padding:12px;color:white;background:#173761;border:1px solid #6188b7}select{width:100%}button{cursor:pointer}button.primary{background:#2379db}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.question{line-height:1.85;white-space:pre-wrap;font-size:clamp(18px,3vw,23px);font-weight:700}.answer{margin-top:16px;padding:16px;background:#0c2444;border-radius:12px;white-space:pre-wrap;line-height:1.7}.muted{color:#b8cde8}.hidden{display:none!important}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:600px){.filters{grid-template-columns:1fr}}</style></head>
<body><main><header><strong>Yoshi.Lab / AI教材プラス</strong><a href="./index.html">← HOMEへ</a></header><h1>📚 本文 Q&A・T/F・Discussion</h1>
<div class="panel"><div class="filters"><label>科目<select id="subject"><option value="英C">英語コミュニケーション</option><option value="論表">論理表現</option></select></label><label>Lesson<select id="lesson"></select></label><label>Part<select id="part"></select></label></div><p id="status" class="muted"></p></div>
<div class="panel hidden" id="study"><h2 id="typeTitle">問題</h2><div class="actions"><button id="qa">本文Q&A</button><button id="trueFalse">True / False</button><button id="discussion">Discussion</button></div><p id="position" class="muted"></p><div class="question" id="question"></div><div class="answer hidden" id="answer"></div><div class="actions" style="margin-top:22px"><button class="primary" id="reveal">答え・訳を見る</button><button id="next">次の問題 →</button></div><p class="muted">この教材は自主学習用です。現時点ではXP・学習履歴の保存は行いません。</p></div>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),kindNames={qa:'本文Q&A',trueFalse:'True / False',discussion:'Discussion'};let groups=[],kind='qa',idx=0;
function pick(){return groups.find(x=>x.subject===$('subject').value&&String(x.id)===$('lesson').value&&String(x.name)===$('part').value)}
function options(el,values){el.replaceChildren();for(const value of values){const o=document.createElement('option');o.value=value;o.textContent=value;el.append(o)}}
function unique(v){return [...new Set(v)].sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}))}
function render(){const g=pick();$('study').classList.toggle('hidden',!g);if(!g)return;const rows=Array.isArray(g[kind])?g[kind]:[];$('typeTitle').textContent=kindNames[kind];$('position').textContent=rows.length?'問題 '+(idx+1)+' / '+rows.length:'この形式の問題はまだありません';$('question').textContent=rows[idx]?.question||'';$('answer').textContent=rows[idx]?'答え・模範解答：'+rows[idx].answer+'\n\n日本語：'+rows[idx].translation:'';$('answer').classList.add('hidden');$('reveal').disabled=!rows.length;$('next').disabled=!rows.length;}
function updateParts(){const s=$('subject').value,l=$('lesson').value;options($('part'),unique(groups.filter(x=>x.subject===s&&String(x.id)===l).map(x=>String(x.name))));idx=0;render()}
function updateLessons(){const s=$('subject').value;options($('lesson'),unique(groups.filter(x=>x.subject===s).map(x=>String(x.id))));updateParts()}
$('subject').addEventListener('change',updateLessons);$('lesson').addEventListener('change',updateParts);$('part').addEventListener('change',()=>{idx=0;render()});
for(const type of Object.keys(kindNames))$(type).addEventListener('click',()=>{kind=type;idx=0;render()});
$('reveal').addEventListener('click',()=>$('answer').classList.remove('hidden'));
$('next').addEventListener('click',()=>{const rows=pick()?.[kind]||[];if(!rows.length)return;idx=(idx+1)%rows.length;render()});
fetch('./studio-materials.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('教材の取得に失敗しました');return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('教材形式が不正です');groups=data;updateLessons();$('status').textContent=groups.length?'教材を選んで始めよう！':'まだ公開されたAI追加教材はありません'}).catch(e=>$('status').textContent=e.message);
})();
</script></body></html>
