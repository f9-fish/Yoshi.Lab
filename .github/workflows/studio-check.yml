name: AI教材スタジオの検証
on:
  pull_request:
    paths:
      - 'studio-functions/**'
      - 'teacher-studio.html'
      - 'studio-study.html'
      - 'studio-content.json'
      - 'studio-practice.js'
      - 'tests/studio-practice-integration.test.cjs'
      - 'index.html'
      - 'writing*.js'
      - 'writing.html'
      - 'studio-config.js'
      - 'scripts/studio-publication-audit.cjs'
      - 'tests/studio-publication-audit.test.cjs'
      - 'scripts/studio-publication-runtime-preflight.py'
      - 'tests/studio-publication-runtime-preflight.py'
      - 'scripts/studio-master-runtime-check.py'
      - 'scripts/studio-pr96-deployment.py'
      - 'scripts/studio-question-master-deployment.py'
      - 'tests/studio-question-master-deployment.py'
      - 'tests/studio-master-runtime-check.py'
      - '.github/workflows/studio-check.yml'
  push:
    paths:
      - 'studio-functions/**'
      - 'studio-content.json'
      - 'studio-practice.js'
      - 'tests/studio-practice-integration.test.cjs'
      - 'index.html'
      - 'writing*.js'
      - 'writing.html'
permissions:
  contents: read
jobs:
  studio-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test studio-functions/tests/*.test.cjs tests/studio-publication-audit.test.cjs tests/studio-practice-integration.test.cjs
      - run: python3 tests/studio-master-runtime-check.py
      - run: python3 tests/studio-publication-runtime-preflight.py
      - run: python3 tests/studio-question-master-deployment.py
      - run: node --check studio-functions/index.js
      - run: node --check studio-functions/studio-core.cjs
      - run: node --check studio-config.js
