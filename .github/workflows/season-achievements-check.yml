name: シーズン実績の検証
on:
  pull_request:
    paths:
      - '*season-achievement*'
      - 'account.js'
      - 'learning-xp.js'
      - 'practice-xp.js'
      - 'weekly-daily.js'
      - 'yoshi-ranks-v14.js'
      - 'ranking.html'
      - 'mypage.html'
      - 'scripts/*season-achievement*'
      - 'tests/**'
      - '.github/workflows/season-achievements-check.yml'
permissions:
  contents: read
jobs:
  achievements:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node --test --test-isolation=none tests/season-achievements.test.cjs tests/xp.test.cjs tests/historical-xp.test.cjs tests/radiant-ranking.test.cjs tests/weekly-daily.test.cjs
      - run: npm ci --prefix tests/pair-qa-rules
      - name: Verify access using the Realtime Database emulator
        working-directory: tests/pair-qa-rules
        run: ./node_modules/.bin/firebase emulators:exec --project demo-yoshi-achievements --config ../../firebase.pair-qa-spark-emulator.json --only database 'node --test season-achievements.test.cjs'
