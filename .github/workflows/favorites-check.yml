name: お気に入りの検証
on:
  pull_request:
    paths:
      - 'favorites*'
      - 'firebase*rules*.json'
      - 'firebase.favorites-emulator.json'
      - 'account.js'
      - 'scripts/merge-favorites-rules.cjs'
      - 'tests/*favorites*'
      - 'tests/pair-qa-rules/**'
      - '.github/workflows/favorites-check.yml'
permissions:
  contents: read
jobs:
  favorites:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node --test tests/favorites*.test.cjs
      - run: npm ci --prefix tests/pair-qa-rules
      - name: Validate ownership rules with the repository baseline
        run: |
          node scripts/merge-favorites-rules.cjs firebase-rtdb.rules.qa-integrated.json "$RUNNER_TEMP/favorites-rules.json"
          export FAVORITES_RULES_FILE="$RUNNER_TEMP/favorites-rules.json"
          cd tests/pair-qa-rules
          ./node_modules/.bin/firebase emulators:exec --project demo-yoshi-favorites --config ../../firebase.favorites-emulator.json --only database 'node --test favorites.test.cjs'
