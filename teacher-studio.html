<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yoshi.Lab | AI教材スタジオ</title><link rel="icon" type="image/png" href="./yoshilab-v39-favicon.png?v=cc352874b719"><meta name="yoshilab-studio-api" content="https://studioapi-bfaa4wjjga-an.a.run.app">
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#eef5ff;background:#081831;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#07152ad9,#07152af2),url('./yoshilab-unified-mountain.png') center/cover fixed}main{max-width:1050px;margin:auto;padding:22px 16px 65px}header{display:flex;justify-content:space-between;align-items:center;gap:14px}h1{font-size:clamp(24px,5vw,34px);margin:12px 0}h2{font-size:20px}.panel{background:#152b4bee;border:1px solid #3e6495;border-radius:19px;padding:20px;margin:18px 0;box-shadow:0 12px 35px #0004}.muted{color:#b9cce9}a{color:#a6d7ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:7px;font-size:14px;font-weight:700}input,select,textarea,button{font:inherit;border-radius:10px;padding:11px;color:#fff}input,select,textarea{width:100%;background:#0d203d;border:1px solid #4e719f}textarea{resize:vertical;min-height:120px;line-height:1.6}#source{min-height:220px}button{background:#28538a;border:1px solid #5082b9;font-weight:750;cursor:pointer}button.primary{background:#176fee;border-color:#54b9ff}button:disabled{opacity:.48;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap}.status{margin:12px 0;min-height:24px}.error{color:#ffb6b6}.good{color:#9fefc9}.category{border:1px solid #3c618f;border-radius:12px;margin:14px 0;padding:12px}.question{display:grid;gap:9px;padding:15px 0;border-bottom:1px solid #36577e}.question:last-child{border:0}.question-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.question-head label{display:flex;align-items:center;gap:8px}.question-head input{width:auto}.question textarea{min-height:76px}.small{font-size:12px}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:15px}}
</style></head>
<body><main><header><div><strong>Yoshi.Lab / TEACHER</strong><h1>✨ AI教材スタジオ</h1></div><a href="./teacher.html">教員ダッシュボードへ</a></header>
<section class="panel"><h2>STEP 1｜教材本文を入力</h2><p id="authStatus" class="muted">ログイン・教員権限を確認中…</p>
<div id="editor" class="hidden"><div class="grid">
<label>科目<select id="subject"><option value="英C">英語コミュニケーション</option><option value="論表">論理表現</option></select></label>
<label>Lesson <input id="lesson" maxlength="80" placeholder="例：8 / 12 不定詞(1)"></label>
<label>Part <input id="part" maxlength="30" value="1"></label>
<label>問題数（各種類）<input id="count" type="number" min="1" max="15" value="2"></label></div>
<div class="actions"><button type="button" id="fetchMaster">本文マスターから取得</button><button type="button" id="checkMaster">テストシートの接続を確認</button></div>
<p id="masterCheckStatus" role="status"></p>
<section id="masterPreview" class="hidden" aria-labelledby="masterHeading">
 <h3 id="masterHeading">取得した英文</h3>
 <p id="masterDetails" class="muted"></p>
 <p id="masterText" style="white-space:pre-wrap;overflow-wrap:anywhere"></p>
 <button type="button" id="applyMaster">確認した英文を入力欄に反映</button>
</section>
<p><label>英文（個人情報を含めない）<textarea id="source" placeholder="本文を貼り付ける"></textarea></label></p>
<div class="actions"><button class="primary" id="generate">✨ AIで5種類を生成</button><button id="save">下書きを保存</button><button id="restore">保存した下書きを開く</button></div></div>
<div class="actions"><button id="retryShared" type="button" class="hidden">同じバッチの保存を再試行</button></div>
<p id="sharedStatus" role="status" class="status"></p>
<p id="message" role="status" class="status muted"></p></section>
<section class="panel hidden" id="review"><h2>STEP 2｜問題を確認・編集</h2><p class="muted">採用する問題にチェックを入れ、問題文・正解・日本語訳を確認してから公開してください。AIの出力は必ず教員が確認します。</p><div id="questions"></div></section>
<section class="panel hidden" id="publishPanel"><h2>STEP 3｜一括公開</h2><p class="muted">公開先・重複・必須項目はサーバーでも検証します。公開まで既存教材は変更されません。</p><div class="actions"><button id="publish" class="primary">採用した教材を一括公開</button></div><p id="publishStatus" role="status" class="status"></p></section>
<section id="history" class="panel hidden" aria-labelledby="historyTitle">
<h2 id="historyTitle">共有下書きの履歴</h2>
<button id="checkQuestionMaster" type="button">問題マスターの接続を確認</button>
<p id="questionMasterConnection" role="status"></p>
<form id="historyForm"><div class="grid">
<label>科目<select name="subject"><option value="">すべて</option><option>英C</option><option>論表</option></select></label>
<label>Lesson<input name="lesson" maxlength="80"></label><label>Part<input name="part" maxlength="30"></label>
<label>問題種別<select name="type" id="historyType"><option value="">すべて</option></select></label>
<label>状態<select name="status"><option value="">すべて</option><option>要確認</option><option>承認済</option><option>公開済</option></select></label>
<label>生成日（JST）<input name="date" type="date"></label></div>
<button type="submit">履歴を検索</button></form>
<p id="historyStatus" role="status"></p><div id="historyResults"></div>
<button id="historyNext" type="button" class="hidden">次の検索範囲</button>
</section></main><script src="./studio-config.js"></script><script type="module">
import './account.js';
import {getAuth} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
const $=id=>document.getElementById(id);
const types=[['vocabulary','単語・熟語'],['cloze','文法・穴埋め'],['qa','本文Q&A'],['trueFalse','True / False'],['discussion','Discussion']];
for(const [type,title] of types)$('historyType').add(new Option(title,type));
let historyCursor='',historyRequest=0;
async function loadHistory(next) {
 const request=++historyRequest, serial=authSerial;
 const status=$('historyStatus'),results=$('historyResults'),more=$('historyNext');
 const filters=Object.fromEntries(new FormData($('historyForm')));
 if(!next)results.replaceChildren();
 status.textContent='検索中…';
 more.classList.add('hidden');
 try{
  const data=await api('question-master/search',{...filters,cursor:next?historyCursor:''});
  if(serial!==authSerial||request!==historyRequest)return;
  for(const batch of data.batches){
   const details=document.createElement('details'),summary=document.createElement('summary');
   summary.textContent=[batch.subject,batch.lesson,batch.part,batch.createdAt].join(' / ');
   details.append(summary);
   for(const item of batch.items){
    const problem=document.createElement('details'),label=document.createElement('summary'),text=document.createElement('p');
    label.textContent=(types.find(([type])=>type===item.type)?.[1]||item.type)+' / '+item.status+' / '+item.question;
    text.textContent=[item.answer,item.translation,item.destination,item.commit].filter(Boolean).join(' / ');
    problem.append(label,text);
    if(item.status!=='公開済'&&!batch.pending){
     const form=document.createElement('form'),edited={...item};
     field(form,'問題文',item.question,value=>edited.question=value);
     field(form,'正解・模範解答',item.answer,value=>edited.answer=value);
     field(form,'日本語訳・補足',item.translation,value=>edited.translation=value);
     const adoption=document.createElement('label'), checkbox=document.createElement('input');
     checkbox.type='checkbox';checkbox.checked=item.accepted;
     adoption.append('採用する',checkbox);form.append(adoption);
     const controls=document.createElement('div');controls.className='actions';
     for(const [operation,title] of [['edit','変更を保存（要確認）'],['approve','保存済みの内容を承認'],['return','要確認に戻す']]){
      const button=document.createElement('button');
      button.type='button';button.textContent=title;
      button.addEventListener('click',async()=>{
       if(operation==='approve'&&(!item.accepted||checkbox.checked!==item.accepted||
        ['question','answer','translation'].some(key=>edited[key]!==item[key]))){
        status.textContent='変更を保存してから承認してください';return;
       }
       for(const control of controls.children)control.disabled=true;
       try{
        await api('question-master/update',{...edited,accepted:checkbox.checked,batchId:batch.batchId,
         questionId:item.id,operation});
        if(serial===authSerial)await loadHistory(false);
       }catch(error){
        if(serial===authSerial)status.textContent=error.message;
       }finally{
        for(const control of controls.children)control.disabled=false;
       }
      });
      controls.append(button);
     }
     form.addEventListener('submit',event=>event.preventDefault());
     form.append(controls);problem.append(form);
    }
    details.append(problem);
   }
   if(batch.pending||batch.items.some(item=>item.status==='承認済'&&item.accepted)){
    const publish=document.createElement('button');
    publish.type='button';
    publish.textContent=batch.pending?'保留中の公開を再確認':'承認済みの公開内容を確認';
    publish.addEventListener('click',async()=>{
     publish.disabled=true;
     try{
      const payload={batchId:batch.batchId,version:batch.version};
      const preview=await api('preview',payload);
      if(serial!==authSerial)return;
      const description=preview.pending?'保留中の公開を再確認します。':
       (preview.replacing?'既存のAI教材を置き換えます。':'新規のAI教材を公開します。');
      if(!confirm(preview.slot+' / 承認・採用済み '+preview.newCount+'問。'+description))return;
      const result=await api('publish',{...payload,expectedSha:preview.sha,allowReplace:preview.replacing&&!preview.pending});
      if(serial===authSerial){await loadHistory(false);status.textContent='GitHubに公開しました。コミット '+result.commit;}
     }catch(error){
      if(serial===authSerial){await loadHistory(false);status.textContent=error.message;}
     }finally{publish.disabled=false;}
    });
    details.append(publish);
   }
   results.append(details);
  }
  historyCursor=data.nextCursor||'';
  more.classList.toggle('hidden',!historyCursor);
  status.textContent=data.batches.length?'この範囲で '+data.batches.length+' バッチ見つかりました':(historyCursor?'この範囲には該当なし。次の範囲を検索できます。':'この範囲には該当なし');
 }catch(error){
  if(serial===authSerial&&request===historyRequest)status.textContent=error.message;
 }
}
$('checkQuestionMaster').addEventListener('click',async()=>{
 const serial=authSerial,button=$('checkQuestionMaster'),status=$('questionMasterConnection');
 button.disabled=true;
 status.textContent='読み取り専用で接続を確認しています…';
 try{
  const data=await api('question-master/check',{});
  if(data.connected!==true||data.readOnly!==true)throw Error('接続を確認できませんでした');
  if(serial===authSerial)status.textContent='問題マスターへの読み取り接続を確認しました';
 }catch(error){
  if(serial===authSerial)status.textContent=error.message;
 }finally{
  if(serial===authSerial)button.disabled=false;
 }
});
$('historyForm').addEventListener('submit',event=>{event.preventDefault();void loadHistory(false)});
$('historyForm').addEventListener('input',()=>{
 historyRequest++;
 $('historyResults').replaceChildren();
 $('historyStatus').textContent='';
 $('historyNext').classList.add('hidden');
});
$('historyNext').addEventListener('click',()=>void loadHistory(true));
const storageKey='yoshilab.studio.draft.v1';
let draft=null,busy=false,authSerial=0;
let pendingShared=null, sharedSaving=false;
window.addEventListener('beforeunload',event=>{
 if(pendingShared){event.preventDefault();event.returnValue='';}
});
async function saveShared() {
 if(!pendingShared||sharedSaving)return;
 const serial=authSerial, pending=pendingShared;
 sharedSaving=true;
 $('retryShared').classList.add('hidden');
 $('sharedStatus').className='status';
 $('sharedStatus').textContent='生成した全問を共有下書きに保存しています…';
 try{
  const saved=await api('question-master/save',pending);
  if(serial!==authSerial)return;
  const count=Object.values(pending.questions).reduce((total,items)=>total+items.length,0);
  if(saved.batchId!==pending.batchId||saved.savedCount!==count||saved.status!=='要確認')
   throw Error('全問の保存結果を確認できませんでした');
  pendingShared=null;
  $('sharedStatus').textContent=count+'問を共有下書きに保存しました（要確認）';
 }catch(error){
  if(serial!==authSerial)return;
  $('sharedStatus').className='status error';
  $('sharedStatus').textContent='未保存：'+error.message+'。このタブで再試行してください。';
  $('retryShared').classList.remove('hidden');
 }finally{
  if(serial===authSerial)sharedSaving=false;
 }
}
$('retryShared').addEventListener('click',saveShared);

const endpoint=(window.YoshiStudioApiBase||'').replace(/\/$/,'');
const msg=(value,error=false)=>{$('message').textContent=value;$('message').className='status '+(error?'error':'muted')};
function setBusy(value){busy=value;for(const id of ['generate','publish','save','restore'])$(id).disabled=value}
function clean(s){return String(s??'').trim()}
function validInput(){const subject=$('subject').value,lesson=clean($('lesson').value),part=clean($('part').value),source=clean($('source').value),count=Number($('count').value);if(!['英C','論表'].includes(subject)||!lesson||!part||!source||!Number.isInteger(count)||count<1||count>15)throw Error('科目・Lesson・Part・英文・問題数を確認してください');if(source.length>20000)throw Error('本文は2万文字以内にしてください');return {subject,lesson,part,source,count}}
async function token(){const u=getAuth().currentUser;if(!u)throw Error('Googleログインが必要です');if(!await window.YoshiAccount.isTeacher())throw Error('教員権限がありません');return u.getIdToken()}
async function api(action,payload){if(!endpoint)throw Error('教材スタジオAPIが未設定です。サーバーの構築・設定後に利用できます');const t=await token();const r=await fetch(endpoint+'/'+action,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(payload),signal:AbortSignal.timeout(120000)});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'サーバー処理が失敗しました（HTTP '+r.status+'）');return data}
let masterSerial=0, masterCandidate=null;
function masterSelection(){
 return {subject:$('subject').value,lesson:clean($('lesson').value),part:clean($('part').value)};
}
function clearMaster(){
 masterSerial++;
 masterCandidate=null;
 $('masterPreview').classList.add('hidden');
 $('masterText').textContent='';
 $('masterDetails').textContent='';
 $('fetchMaster').disabled=false;
}
for(const id of ['subject','lesson','part'])$(id).addEventListener('input',clearMaster);
$('fetchMaster').addEventListener('click',async()=>{
 if(busy||$('fetchMaster').disabled)return;
 const selection=masterSelection();
 if(!selection.lesson||!selection.part){msg('科目・Lesson・Partを先に選んでください',true);return;}
 clearMaster();
 const serial=masterSerial,accountSerial=authSerial;
 $('fetchMaster').disabled=true;
 msg('教科書本文マスターを読み取っています…');
 try{
  const data=await api('textbook-master',selection);
  if(serial!==masterSerial||accountSerial!==authSerial||JSON.stringify(selection)!==JSON.stringify(masterSelection()))return;
  if(typeof data.source!=='string'||!data.source.trim()||data.source.length>20000||
     !Number.isInteger(data.sentenceCount)||data.sentenceCount<1||data.sentenceCount>150)throw Error('本文の応答形式が不正です');
  masterCandidate={source:data.source,selection};
  $('masterText').textContent=data.source;
  $('masterDetails').textContent=selection.subject+' / Lesson '+selection.lesson+' / Part '+selection.part+' · '+data.sentenceCount+'行';
  $('masterPreview').classList.remove('hidden');
  msg('取得した英文を確認してから入力欄に反映してください');
 }catch(error){
  if(serial===masterSerial&&accountSerial===authSerial)msg(error.message,true);
 }finally{
  if(serial===masterSerial)$('fetchMaster').disabled=false;
 }
});
$('checkMaster').addEventListener('click',async()=>{
 const serial=authSerial, button=$('checkMaster'), status=$('masterCheckStatus');
 button.disabled=true;
 status.textContent='テストシートのヘッダーを確認しています…';
 try{
  const data=await api('textbook-master/check',{});
  if(data.headerVerified!==true)throw Error('ヘッダーの確認結果を取得できませんでした');
  if(serial===authSerial)status.textContent='テストシートの10列のヘッダーを確認しました';
 }catch(error){
  if(serial===authSerial)status.textContent=error.message;
 }finally{
  if(serial===authSerial)button.disabled=false;
 }
});
$('applyMaster').addEventListener('click',()=>{
 if(busy||!masterCandidate||JSON.stringify(masterCandidate.selection)!==JSON.stringify(masterSelection()))return;
 $('source').value=masterCandidate.source;
 clearMaster();
 $('source').focus();
 msg('英文を入力欄に反映しました。確認後に生成を実行してください');
});
function field(container,label,value,update){const l=document.createElement('label');l.textContent=label;const textarea=document.createElement('textarea');textarea.value=clean(value);textarea.addEventListener('input',()=>update(textarea.value));l.append(textarea);container.append(l)}
function render(){if(!draft)return;$('review').classList.remove('hidden');$('publishPanel').classList.remove('hidden');$('questions').replaceChildren();for(const [type,title] of types){const section=document.createElement('section');section.className='category';const h=document.createElement('h3');h.textContent=title+' ('+(draft.questions[type]||[]).length+'問)';section.append(h);for(const [index,item] of (draft.questions[type]||[]).entries()){const card=document.createElement('div');card.className='question';const top=document.createElement('div');top.className='question-head';const l=document.createElement('label'),checked=document.createElement('input');checked.type='checkbox';checked.checked=item.accepted!==false;checked.addEventListener('change',()=>item.accepted=checked.checked);l.append(checked,document.createTextNode('採用する'));const num=document.createElement('strong');num.textContent='問'+(index+1);top.append(num,l);card.append(top);field(card,'問題文',item.question,v=>item.question=v);field(card,'正解・模範解答',item.answer,v=>item.answer=v);field(card,'日本語訳・補足',item.translation,v=>item.translation=v);section.append(card)}$('questions').append(section)}}
function normalize(data,input){if(!data||typeof data!=='object'||!data.questions||typeof data.questions!=='object')throw Error('AIが想定外の形式を返しました');const questions={};for(const [type] of types){if(!Array.isArray(data.questions[type]))throw Error('問題種別 '+type+' の形式が不正です');questions[type]=data.questions[type].map(item=>({question:clean(item.question),answer:clean(item.answer),translation:clean(item.translation),accepted:item.accepted!==false}))}return {...input,questions}}
function selected(){if(!draft)throw Error('先に教材を生成してください');const input=validInput();if(input.subject!==draft.subject||input.lesson!==draft.lesson||input.part!==draft.part||input.source!==draft.source)throw Error('本文や教材番号を変更した場合はAI生成をやり直してください');const picked={};let total=0;for(const [type] of types){picked[type]=draft.questions[type].filter(item=>item.accepted).map(({question,answer,translation})=>({question:clean(question),answer:clean(answer),translation:clean(translation)}));for(const q of picked[type]){if(!q.question||!q.answer||!q.translation)throw Error('採用した問題に未入力項目があります：'+type);if(q.question.length>3000||q.answer.length>3000||q.translation.length>3000)throw Error('問題の文字数が長すぎます')}total+=picked[type].length}if(!total)throw Error('採用する問題がありません');return {...input,questions:picked}}
$('generate').addEventListener('click',async()=>{if(busy||pendingShared)return;setBusy(true);try{const serial=authSerial;const input=validInput();msg('AI教材を生成しています…');const data=await api('generate',input);if(serial!==authSerial)return;draft=normalize(data,input);render();
if(data.sharedDraft===true){
 pendingShared={...input,questions:data.questions,batchId:crypto.randomUUID()};
 $('publishPanel').classList.add('hidden');
 void saveShared();
}
msg('生成完了。内容を確認して採用する問題を選んでください')}catch(e){msg(e.message,true)}finally{setBusy(false)}});
$('save').addEventListener('click',()=>{try{if(!draft)throw Error('保存する問題がありません');localStorage.setItem(storageKey,JSON.stringify(draft));msg('この端末のブラウザに下書きを保存しました（共有・自動バックアップではありません）')}catch(e){msg(e.message,true)}});
$('restore').addEventListener('click',()=>{try{const data=JSON.parse(localStorage.getItem(storageKey)||'null');if(!data)throw Error('保存済み下書きがありません');draft=normalize(data,data);clearMaster();for(const id of ['subject','lesson','part','source','count'])$(id).value=draft[id];render();msg('下書きを復元しました')}catch(e){msg(e.message,true)}});
$('publish').addEventListener('click',async()=>{if(busy)return;try{const payload=selected();setBusy(true);$('publishStatus').textContent='サーバーで検証・公開中…';const preview=await api('preview',payload);if(!confirm('公開先：'+preview.slot+'\n採用：'+preview.newCount+'問\n'+(preview.replacing?'既存のAI教材 '+preview.previousCount+'問を置き換えます。':'新規のAI教材として追加します。')+'\n公開しますか？')){$('publishStatus').textContent='公開を取り消しました';return}payload.expectedSha=preview.sha;const result=await api('publish',payload);$('publishStatus').textContent='GitHubに保存しました。アプリへの配信は数分後になる場合があります。 '+(result.url||'')}catch(e){$('publishStatus').textContent=e.message;$('publishStatus').className='status error'}finally{setBusy(false)}});
window.YoshiAccount.subscribe(async()=>{const serial=++authSerial;$('questionMasterConnection').textContent='';$('checkQuestionMaster').disabled=false;$('history').classList.add('hidden');$('historyResults').replaceChildren();$('historyStatus').textContent='';$('historyNext').classList.add('hidden');pendingShared=null;sharedSaving=false;$('sharedStatus').textContent='';$('retryShared').classList.add('hidden');clearMaster();$('masterCheckStatus').textContent='';$('checkMaster').disabled=false;draft=null;$('review').classList.add('hidden');$('publishPanel').classList.add('hidden');$('questions').replaceChildren();$('source').value='';const a=window.YoshiAccount;if(!a)return;try{if(!a.user){$('authStatus').textContent='教員ダッシュボードでGoogleログインしてください';$('editor').classList.add('hidden');return}const allowed=await a.isTeacher();if(serial!==authSerial)return;$('authStatus').textContent=allowed?'教員権限を確認しました':'教員権限がありません';$('editor').classList.toggle('hidden',!allowed);$('history').classList.toggle('hidden',!allowed)}catch(e){$('authStatus').textContent='教員権限を確認できません: '+e.message;$('editor').classList.add('hidden')}});
</script></body></html>
