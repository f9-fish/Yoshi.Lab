<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yoshi.Lab | AI教材スタジオ</title><link rel="icon" type="image/png" href="./yoshilab-v39-favicon.png?v=cc352874b719"><meta name="yoshilab-studio-api" content="https://studioapi-bfaa4wjjga-an.a.run.app">
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#eef5ff;background:#081831;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#07152ad9,#07152af2),url('./yoshilab-unified-mountain.png') center/cover fixed}main{max-width:1050px;margin:auto;padding:22px 16px 65px}header{display:flex;justify-content:space-between;align-items:center;gap:14px}h1{font-size:clamp(24px,5vw,34px);margin:12px 0}h2{font-size:20px}.panel{background:#152b4bee;border:1px solid #3e6495;border-radius:19px;padding:20px;margin:18px 0;box-shadow:0 12px 35px #0004}.muted{color:#b9cce9}a{color:#a6d7ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:7px;font-size:14px;font-weight:700}input,select,textarea,button{font:inherit;border-radius:10px;padding:11px;color:#fff}input,select,textarea{width:100%;background:#0d203d;border:1px solid #4e719f}textarea{resize:vertical;min-height:120px;line-height:1.6}#source{min-height:220px}button{background:#28538a;border:1px solid #5082b9;font-weight:750;cursor:pointer}button.primary{background:#176fee;border-color:#54b9ff}button:disabled{opacity:.48;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap}.status{margin:12px 0;min-height:24px}.error{color:#ffb6b6}.good{color:#9fefc9}.category{border:1px solid #3c618f;border-radius:12px;margin:14px 0;padding:12px}.question{display:grid;gap:9px;padding:15px 0;border-bottom:1px solid #36577e}.question:last-child{border:0}.question-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.question-head label{display:flex;align-items:center;gap:8px}.question-head input{width:auto}.question textarea{min-height:76px}.small{font-size:12px}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:15px}}
</style></head>
<body><main><header><div><strong>Yoshi.Lab / TEACHER</strong><h1>✨ AI教材スタジオ</h1></div><a href="./teacher.html">教員ダッシュボードへ</a></header>
<section class="panel"><h2>STEP 1｜教材本文を入力</h2><p id="authStatus" class="muted">ログイン・教員権限を確認中…</p>
<div id="editor" class="hidden"><div class="grid">
<label>科目<select id="subject"><option value="英C">英語コミュニケーション</option><option value="論表">論理表現</option></select></label>
<label>Lesson <input id="lesson" maxlength="80" placeholder="例：8 / 12 不定詞(1)"></label>
<label>Part <input id="part" maxlength="30" value="1"></label>
<label>問題数（各種類）<input id="count" type="number" min="1" max="15" value="4"></label></div>
<p><label>英文（個人情報を含めない）<textarea id="source" placeholder="本文を貼り付ける"></textarea></label></p>
<div class="actions"><button class="primary" id="generate">✨ AIで5種類を生成</button><button id="save">下書きを保存</button><button id="restore">保存した下書きを開く</button></div></div>
<p id="message" role="status" class="status muted"></p></section>
<section class="panel hidden" id="review"><h2>STEP 2｜問題を確認・編集</h2><p class="muted">採用する問題にチェックを入れ、問題文・正解・日本語訳を確認してから公開してください。AIの出力は必ず教員が確認します。</p><div id="questions"></div></section>
<section class="panel hidden" id="publishPanel"><h2>STEP 3｜一括公開</h2><p class="muted">公開先・重複・必須項目はサーバーでも検証します。公開まで既存教材は変更されません。</p><div class="actions"><button id="publish" class="primary">採用した教材を一括公開</button></div><p id="publishStatus" role="status" class="status"></p></section>
</main><script src="./studio-config.js"></script><script type="module">
import './account.js';
import {getAuth} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
const $=id=>document.getElementById(id);
const types=[['vocabulary','単語・熟語'],['cloze','文法・穴埋め'],['qa','本文Q&A'],['trueFalse','True / False'],['discussion','Discussion']];
const storageKey='yoshilab.studio.draft.v1';
let draft=null,busy=false,authSerial=0;
const endpoint=(window.YoshiStudioApiBase||'').replace(/\/$/,'');
const msg=(value,error=false)=>{$('message').textContent=value;$('message').className='status '+(error?'error':'muted')};
function setBusy(value){busy=value;for(const id of ['generate','publish','save','restore'])$(id).disabled=value}
function clean(s){return String(s??'').trim()}
function validInput(){const subject=$('subject').value,lesson=clean($('lesson').value),part=clean($('part').value),source=clean($('source').value),count=Number($('count').value);if(!['英C','論表'].includes(subject)||!lesson||!part||!source||!Number.isInteger(count)||count<1||count>15)throw Error('科目・Lesson・Part・英文・問題数を確認してください');if(source.length>20000)throw Error('本文は2万文字以内にしてください');return {subject,lesson,part,source,count}}
async function token(){const u=getAuth().currentUser;if(!u)throw Error('Googleログインが必要です');if(!await window.YoshiAccount.isTeacher())throw Error('教員権限がありません');return u.getIdToken()}
async function api(action,payload){if(!endpoint)throw Error('教材スタジオAPIが未設定です。サーバーの構築・設定後に利用できます');const t=await token();const r=await fetch(endpoint+'/'+action,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(payload),signal:AbortSignal.timeout(120000)});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'サーバー処理が失敗しました（HTTP '+r.status+'）');return data}
function field(container,label,value,update){const l=document.createElement('label');l.textContent=label;const textarea=document.createElement('textarea');textarea.value=clean(value);textarea.addEventListener('input',()=>update(textarea.value));l.append(textarea);container.append(l)}
function render(){if(!draft)return;$('review').classList.remove('hidden');$('publishPanel').classList.remove('hidden');$('questions').replaceChildren();for(const [type,title] of types){const section=document.createElement('section');section.className='category';const h=document.createElement('h3');h.textContent=title+' ('+(draft.questions[type]||[]).length+'問)';section.append(h);for(const [index,item] of (draft.questions[type]||[]).entries()){const card=document.createElement('div');card.className='question';const top=document.createElement('div');top.className='question-head';const l=document.createElement('label'),checked=document.createElement('input');checked.type='checkbox';checked.checked=item.accepted!==false;checked.addEventListener('change',()=>item.accepted=checked.checked);l.append(checked,document.createTextNode('採用する'));const num=document.createElement('strong');num.textContent='問'+(index+1);top.append(num,l);card.append(top);field(card,'問題文',item.question,v=>item.question=v);field(card,'正解・模範解答',item.answer,v=>item.answer=v);field(card,'日本語訳・補足',item.translation,v=>item.translation=v);section.append(card)}$('questions').append(section)}}
function normalize(data,input){if(!data||typeof data!=='object'||!data.questions||typeof data.questions!=='object')throw Error('AIが想定外の形式を返しました');const questions={};for(const [type] of types){if(!Array.isArray(data.questions[type]))throw Error('問題種別 '+type+' の形式が不正です');questions[type]=data.questions[type].map(item=>({question:clean(item.question),answer:clean(item.answer),translation:clean(item.translation),accepted:item.accepted!==false}))}return {...input,questions}}
function selected(){if(!draft)throw Error('先に教材を生成してください');const input=validInput();if(input.subject!==draft.subject||input.lesson!==draft.lesson||input.part!==draft.part||input.source!==draft.source)throw Error('本文や教材番号を変更した場合はAI生成をやり直してください');const picked={};let total=0;for(const [type] of types){picked[type]=draft.questions[type].filter(item=>item.accepted).map(({question,answer,translation})=>({question:clean(question),answer:clean(answer),translation:clean(translation)}));for(const q of picked[type]){if(!q.question||!q.answer||!q.translation)throw Error('採用した問題に未入力項目があります：'+type);if(q.question.length>3000||q.answer.length>3000||q.translation.length>3000)throw Error('問題の文字数が長すぎます')}total+=picked[type].length}if(!total)throw Error('採用する問題がありません');return {...input,questions:picked}}
$('generate').addEventListener('click',async()=>{if(busy)return;setBusy(true);try{const serial=authSerial;const input=validInput();msg('AI教材を生成しています…');const data=await api('generate',input);if(serial!==authSerial)return;draft=normalize(data,input);render();msg('生成完了。内容を確認して採用する問題を選んでください')}catch(e){msg(e.message,true)}finally{setBusy(false)}});
$('save').addEventListener('click',()=>{try{if(!draft)throw Error('保存する問題がありません');localStorage.setItem(storageKey,JSON.stringify(draft));msg('この端末のブラウザに下書きを保存しました（共有・自動バックアップではありません）')}catch(e){msg(e.message,true)}});
$('restore').addEventListener('click',()=>{try{const data=JSON.parse(localStorage.getItem(storageKey)||'null');if(!data)throw Error('保存済み下書きがありません');draft=normalize(data,data);for(const id of ['subject','lesson','part','source','count'])$(id).value=draft[id];render();msg('下書きを復元しました')}catch(e){msg(e.message,true)}});
$('publish').addEventListener('click',async()=>{if(busy)return;try{const payload=selected();setBusy(true);$('publishStatus').textContent='サーバーで検証・公開中…';const preview=await api('preview',payload);if(!confirm('公開先：'+preview.slot+'\n採用：'+preview.newCount+'問\n'+(preview.replacing?'既存のAI教材 '+preview.previousCount+'問を置き換えます。':'新規のAI教材として追加します。')+'\n公開しますか？')){$('publishStatus').textContent='公開を取り消しました';return}payload.expectedSha=preview.sha;const result=await api('publish',payload);$('publishStatus').textContent='GitHubに保存しました。アプリへの配信は数分後になる場合があります。 '+(result.url||'')}catch(e){$('publishStatus').textContent=e.message;$('publishStatus').className='status error'}finally{setBusy(false)}});
window.YoshiAccount.subscribe(async()=>{const serial=++authSerial;draft=null;$('review').classList.add('hidden');$('publishPanel').classList.add('hidden');$('questions').replaceChildren();$('source').value='';const a=window.YoshiAccount;if(!a)return;try{if(!a.user){$('authStatus').textContent='教員ダッシュボードでGoogleログインしてください';$('editor').classList.add('hidden');return}const allowed=await a.isTeacher();if(serial!==authSerial)return;$('authStatus').textContent=allowed?'教員権限を確認しました':'教員権限がありません';$('editor').classList.toggle('hidden',!allowed)}catch(e){$('authStatus').textContent='教員権限を確認できません: '+e.message;$('editor').classList.add('hidden')}});
</script></body></html>
